# The whole pipeline, in one file.
#
# Runs every time you push to the main branch, and does four things:
#
#   1. Runs the tests
#   2. Builds both Docker images
#   3. Pushes them to Docker Hub
#   4. Tells the server to run the new version
#
# The important idea: after you push, nobody logs into a server. Everything
# below happens on GitHub's computers.

name: Build and deploy

on:
  push:
    branches: [main]
  # Lets you re-run it from the Actions tab without changing any code.
  workflow_dispatch:

# Never run two deployments at the same time.
concurrency:
  group: deploy

jobs:
  # -------------------------------------------------------------------------
  # 1. Tests. If these fail, nothing gets built or deployed.
  # -------------------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the API
        working-directory: app/api
        run: |
          npm ci
          npm run test:unit

      - name: Check the web app builds
        working-directory: app/web
        run: |
          npm ci
          npm run build

  # -------------------------------------------------------------------------
  # 2 and 3. Build both images and push them to Docker Hub.
  # -------------------------------------------------------------------------
  build:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Work out a version number
        id: version
        run: |
          # Name the image after the exact code version it was built from.
          # That way you can always answer "which version is running?" - just
          # look at the tag.
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: ./app/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agribridge-api:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agribridge-api:latest
          build-args: |
            GIT_SHA=${{ steps.version.outputs.tag }}
          # Reuse layers from the last build so this takes seconds, not minutes.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web app
        uses: docker/build-push-action@v6
        with:
          context: ./app/web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agribridge-web:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agribridge-web:latest
          build-args: |
            GIT_SHA=${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # -------------------------------------------------------------------------
  # 4. Deploy to the server using Helm.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Connect to the cluster
        run: |
          # The credential comes from a GitHub secret, so it never appears in
          # the code and never appears in the logs.
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          kubectl get nodes || {
            echo "::error::Cannot reach the cluster."
            echo "If you rebuilt the server its address changed - fetch the"
            echo "kubeconfig again and update the KUBECONFIG_B64 secret."
            exit 1
          }

      - name: Deploy with Helm
        run: |
          # --install    create it if this is the first time, upgrade if not
          # --atomic     if the new version fails to start, put the old one back
          # --wait       do not report success until the pods are actually ready
          helm upgrade --install agribridge ./charts/agribridge \
            --namespace agribridge \
            --create-namespace \
            --set dockerhubUser=${{ secrets.DOCKERHUB_USERNAME }} \
            --set imageTag=${{ needs.build.outputs.tag }} \
            --atomic \
            --wait \
            --timeout 8m

      - name: Show what is running
        run: |
          kubectl -n agribridge get pods
          echo
          echo "Version the app reports about itself:"
          kubectl -n agribridge run check-version \
            --rm -i --restart=Never --image=curlimages/curl:8.11.0 -- \
            curl -s http://agribridge-api:3000/version || true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deployment ${{ job.status }}"
            echo
            echo "Version deployed: \`${{ needs.build.outputs.tag }}\`"
            echo
            echo "Open the app at http://<your-server-ip>:30080"
          } >> $GITHUB_STEP_SUMMARY
