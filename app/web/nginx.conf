# nginx configuration for the AgriBridge web tier.
#
# Runs entirely as an unprivileged user, which is why:
#   - it listens on 8080, not 80 (ports below 1024 need CAP_NET_BIND_SERVICE)
#   - the pid and all temp paths live under /tmp, the only writable location
#     once readOnlyRootFilesystem is enforced by the chart
#
# Retires part of SEC-2: a web server running as root inside a container is a
# needless privilege that buys nothing.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every writable path relocated so the root filesystem can stay read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access logs so Promtail can parse them into Loki labels, and so the
    # request id set by the API is queryable from the edge inwards.
    log_format json escape=json
        '{"ts":"$time_iso8601","level":"info","service":"agribridge-web",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,"referer":"$http_referer",'
        '"user_agent":"$http_user_agent","request_id":"$http_x_request_id"}';

    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Compression matters here more than almost anywhere else: the median user
    # is on a 240 kbps 3G connection (NFR-04).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # Resolve upstream names at REQUEST time rather than at startup.
    #
    # By default nginx resolves every proxy_pass hostname when it parses the
    # config, and refuses to start if one does not resolve. In Kubernetes that
    # makes the web tier crash-loop whenever it starts before the api Service
    # exists, or whenever cluster DNS has a brief wobble - a hard dependency on
    # something that is only ever needed per request.
    #
    # With a resolver plus a variable in proxy_pass, an unresolvable upstream
    # degrades to a 502 on the affected request instead of taking the whole
    # server down. The address is read from /etc/resolv.conf by the entrypoint,
    # so this works unchanged under Kubernetes and under docker compose.
    resolver RESOLVER_ADDR valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Any location below that defines its own add_header must include this
        # again - see the explanation in the file itself.
        include /etc/nginx/security-headers.conf;

        # Container-local liveness target. Deliberately does not touch the API:
        # the web tier being up is a separate fact from the API being up, and
        # conflating them means one failure takes out two Deployments.
        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"agribridge-web"}';
        }

        # Proxy the API so the browser only ever talks to one origin. This is
        # what lets the same image run in staging and production with no
        # rebuild - there is no API hostname compiled into the bundle.
        location /api/ {
            # A variable is what defers resolution to request time. Because
            # proxy_pass then no longer appends the matched location remainder
            # automatically, $request_uri is used to pass the original path and
            # query string through unchanged.
            set $api_upstream "$API_UPSTREAM";
            proxy_pass         http://$api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Generate a correlation id at the edge if the client did not send
            # one, so a request can be traced from nginx through to Postgres.
            proxy_set_header   X-Request-Id      $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # /version proxied through so the footer can display the API's commit.
        location = /version {
            set $version_upstream "$API_UPSTREAM";
            proxy_pass       http://$version_upstream/version;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        # Hashed build assets are immutable - cache them hard.
        location /assets/ {
            # One Cache-Control, not two. `expires 1y` emits its own header, so
            # pairing it with an explicit add_header sent the directive twice.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # index.html must never be cached, or a deploy leaves users on the old
        # bundle referencing assets that no longer exist.
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
        }

        # Single-page app fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
