# Security headers, kept in one file and included wherever they are needed.
#
# This exists because of an nginx rule that catches almost everyone:
#
#   add_header directives are inherited from an outer level ONLY IF the current
#   level defines no add_header directives of its own. Defining a single
#   add_header inside a location silently discards every inherited one.
#
# So declaring these once in the server block was not enough: `location =
# /index.html` and `location /assets/` each set their own Cache-Control, which
# threw away all four security headers on exactly the two paths every visitor
# loads. Nothing warns you - the headers are simply absent, and you only notice
# if you look at a response.
#
# Including this file in each such location is the fix. `always` makes the
# headers apply to error responses too, not just 2xx.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
