{{/*
The database password and the key used to sign login sessions.

Helm generates both the first time you install, then reuses them on every
upgrade. That reuse matters: if the password changed on each deploy, the
application would stop being able to open the database it created earlier, and
the error looks nothing like the cause.

Two things worth pointing out when you present this:

  - No password is written down anywhere in this project. Nothing to
    accidentally commit to Git.
  - A Kubernetes Secret is only base64 ENCODED, not encrypted. Anyone who can
    read secrets in this namespace can read the password. It keeps credentials
    out of your source code, which is the main thing, but it is not a vault.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  {{- if $existing }}
  # Already exists - keep the values it has.
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" | b64dec | quote }}
  PGPASSWORD:        {{ index $existing.data "PGPASSWORD" | b64dec | quote }}
  JWT_SECRET:        {{ index $existing.data "JWT_SECRET" | b64dec | quote }}
  {{- else }}
  # First install - generate them.
  {{- $password := randAlphaNum 24 }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  PGPASSWORD:        {{ $password | quote }}
  JWT_SECRET:        {{ randAlphaNum 40 | quote }}
  {{- end }}
